<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bilans offerts Fitness Park</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilans FP">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#3f444d">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #3f444d; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<!-- Adresse de l'appli Apps Script (Déployer > Gérer les déploiements). À remplacer par l'URL /exec une fois déployée. -->
<iframe id="appli" src="https://script.google.com/macros/s/AKfycbwoI5Mf2I0G1dvBF0VV0G2zzCHC5h0auoZSKcbB-76i9aLrHS4lCV9NOR84jataVWKP/exec" title="Bilans offerts Fitness Park" allow="clipboard-write"></iframe>
<div id="bientot" style="display:none;position:fixed;inset:0;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;text-align:center;padding:80px 24px">
  <img src="icone-512.png" alt="" style="width:160px;height:160px;border-radius:36px">
  <h1 style="font-size:24px;margin:24px 0 8px">Bilans offerts Fitness Park</h1>
  <p style="color:#d4d4d4;font-size:17px">L'appli arrive très bientôt.</p>
</div>
<script>
  // Tant que l'adresse de l'appli n'est pas renseignée, on affiche « bientôt » plutôt qu'une page cassée
  if (document.getElementById('appli').getAttribute('src').indexOf('URL_APPLI') === 0) {
    document.getElementById('appli').remove();
    document.getElementById('bientot').style.display = 'block';
  }
  // Mémoire du code du coach (17/11/2026) : gardée ici, sur bilans-fp.github.io, car Safari efface celle du cadre Google.
  // L'appli demande le code au démarrage, le donne après une connexion réussie, le fait oublier sur « Changer de code ».
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/([a-z0-9-]+[.-])?script\.googleusercontent\.com$/.test(e.origin) || !e.data || !e.data.bilansFP) return;
    var cle = 'bilans_code', m = e.data;
    try {
      if (m.bilansFP === 'garder' && /^[A-Z0-9]{3,12}$/.test(m.valeur)) localStorage.setItem(cle, m.valeur);
      else if (m.bilansFP === 'oublier') localStorage.removeItem(cle);
      else if (m.bilansFP === 'vibrer') { if (navigator.vibrate) navigator.vibrate(12); } // Android : petite vibration à chaque appui
      else if (m.bilansFP === 'demande') e.source.postMessage({ bilansFP: 'code', valeur: localStorage.getItem(cle) || '' }, e.origin);
    } catch (err) { if (m.bilansFP === 'demande') e.source.postMessage({ bilansFP: 'code', valeur: '' }, e.origin); }
  });
</script>
</body>
</html>
